spring:
  datasource:
    url: jdbc:h2:file:./target/testdb;AUTO_SERVER=TRUE;MODE=MySQL;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

eureka:
  client:
    enabled: false

jwt:
  secret: mySecretKey1234567890
  expirationMs: 86400000

superadmin:
  username: superadmin
  email: superadmin@simpleecom.com
  password: SuperAdmin@123
