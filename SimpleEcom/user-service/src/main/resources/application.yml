server:
  port: 8081
  
spring:
  application:
    name: user-service

  h2:
    console:
      enabled: true
      path: /h2-console

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/simpleecom_userdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:ganesH@123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:mySecretKey1234567890}
  expirationMs: ${JWT_EXPIRATION_MS:3600000}

superadmin:
  username: ${SUPERADMIN_USERNAME:superadmin}
  email: ${SUPERADMIN_EMAIL:superadmin@simpleecom.com}
  password: ${SUPERADMIN_PASSWORD:SuperAdmin@123}
