server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: simpleecom-services
    static_configs:
      - targets:
          - localhost
        labels:
          job: simpleecom-logs
          __path__: /var/log/services/**/logs/*.json

    pipeline_stages:
      - json:
          expressions:
            service: service
            level: level
            traceId: traceId
            logger: logger_name
            message: message
      - labels:
          service:
          level:
          traceId:
